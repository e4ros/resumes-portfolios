<!DOCTYPE html>
<html>
<head>
    <title>Ethan Granat</title>
    <style>
        /* Centers everything, updates font, and enforces black text only */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            color: #000000;
            margin-top: 10vh;
        }
        /* Removes bullet points and centers the list */
        ul {
            list-style-type: none;
            padding: 0;
        }
        /* Spacing for the stacked vertical links */
        li {
            margin: 15px 0;
        }
        /* Styles links to be black text without underlines */
        a {
            color: #000000;
            text-decoration: none;
            font-size: 18px;
        }
        /* Adds an underline only when hovering over the links */
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
